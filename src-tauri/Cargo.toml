[package]
name = "open-door-accessible-assistant"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "open_door_accessible_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
